access_control:
  disk:
    override: [read, write] #Force disk to be read and write on all parameters

id_space_shift: 8

parameters:
  base_variable_float:
    local_id: 1
    type: f32
    description: A test variable
    default: 0.2
    extensions: 
      - type: validation_limit_value
        min: -30
        max: 30

  group:
    local_id: 2 #0x04000000
    id_space_shift: 4 

    children:
      base_variable_group:
        local_id: 1
        type: f32
        description: A test variable
        default: 0.2
        extensions: 
          - type: validation_limit_value
            min: -30
            max: 30

  base_variable_reference_extension:
    local_id: 3
    type: f32
    description: A test variable
    default: 0
    extensions: 
      - type: io_reference
        reference: base_variable_float

  base_variable_reference_group_extension:
    local_id: 4
    type: f32
    description: A test variable
    default: 0
    extensions: 
      - type: io_reference
        reference: group.base_variable_group


