access_control:
  disk:
    override: [read, write] #Force disk to be read and write on all parameters

  cli:
    default: [read, log_write]

  ble:
    default: []

  guest:
    default: []

parameters:
  basic_group:
    local_id: 0x1
    access_control:
      ble: [read, write]
      disk: { override: [] }

    children:
      test_variable_A:
        local_id: 0x1
        type: f32
        description: A test variable
        default: 0.2

      test_variable_B:
        local_id: 0x1
        type: f32
        description: A test variable
        default: 1.23
        access_control:
          ble: { override: [R] }

      test_variable_small:
        local_id: 0x1
        type: u8
        description: A small test variable
        default: 88

  another_group:
    local_id: 0x2
    children:
      test_variable_A:
        local_id: 0x1
        type: f32
        description: A test variable
        default: 0.0

      test_variable_B:
        local_id: 0x1
        type: f32
        description: A test variable
        default: 1.23

      test_variable_small:
        local_id: 0x1
        type: u8
        description: A small test variable
        default: 88
