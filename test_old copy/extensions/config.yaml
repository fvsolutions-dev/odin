access_control:
  disk:
    override: [read, write] #Force disk to be read and write on all parameters

id_space_shift: 8

parameters:
  validate_variable:
    local_id: 1
    type: f32
    description: A test variable
    default: 0.2
    extensions: 
      - type: validation_limit_value
        min: -30
        max: 30

  group:
    local_id: 2 #0x04000000
    id_space_shift: 4 

    children:
      validate_variable:
        local_id: 1
        type: f32
        description: A test variable
        default: 0.2
        extensions: 
          - type: validation_limit_value
            min: -30
            max: 30

  referenced_variable:
    local_id: 3
    type: f32
    description: A test variable
    default: 0
    extensions: 
      - type: io_mapped_numner
        reference: validate_variable
        offset: 1
        scale: 5

  referenced_variable_in_group:
    local_id: 4
    type: f32
    description: A test variable
    default: 0
    extensions: 
      - type: io_mapped_numner
        reference: group.validate_variable


