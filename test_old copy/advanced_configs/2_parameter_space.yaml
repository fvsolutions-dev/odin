access_control:
  disk:
    override: [read, write] #Force disk to be read and write on all parameters

id_space_shift: 8 

parameters:
  test_variable_A: #0x01000000
    local_id: 1 
    type: f32
    description: A test variable
    default: 0.2

  test_variable_B: #0x02000000
    local_id: 0xFF
    type: f32
    description: A test variable
    default: 1.23

  group_1: #0x03000000
    local_id: 3
    id_space_shift: 8 #Shifts the next subgroup to the left by 8 bits

    children:
      test_variable_A: #0x03010000
        local_id: 1
        type: f32
        description: A test variable
        default: 0.0

      test_variable_B: #0x03020000
        local_id: 2
        type: f32
        description: A test variable
        default: 1.23

      test_variable_small: #0x03030000
        local_id: 3
        type: u8
        description: A small test variable
        default: 88

  group_2:
    local_id: 4 #0x04000000
    id_space_shift: 4 

    children:
      test_variable_A: #0x0410000
        local_id: 1
        type: f32
        description: A test variable
        default: 0.0

      test_variable_B: #0x0420000
        local_id: 2
        type: f32
        description: A test variable
        default: 1.23

      test_variable_small: #0x0430000
        local_id: 3 
        type: u8
        description: A small test variable
        default: 88

      group_3:
        local_id: 4
        id_space_shift: 12

        children:
          test_variable_A: #0x0440010
            local_id: 1
            type: f32
            description: A test variable
            default: 0.0

          test_variable_B: #0x0440020 
            local_id: 2
            type: f32
            description: A test variable
            default: 1.23
          test_variable_small: #0x0445FF00
            local_id: 0x5FF
            type: u8
            description: A small test variable
            default: 88