# Config testing for all types of parameters

test_variable_i32:
  local_id: 0x1
  type: i32
  description: A test variable of type signed 32 bit integer
  default: 15

i32_array:
  local_id: 0x2
  type: i32
  elements: 10
  description: A test variable
  default: [-2147483648, -2147483647, -2147483646, -2147483645, -2147483644, 5, 6, 7, 8, 9]
 
i32_variable_length_array:
  local_id: 0x3
  type: i32
  max_elements: 50
  description: My variable length array, allowing writes with a variable length, it also stores a reference to the length of the array
  default: [-2147483648, -2147483647, -2147483646, -2147483645, -2147483644, 5, 6, 7, 8, 9]
