[tool.poetry]
name = "odin-python"
version = "0.1.0"
description = ""
authors = ["floris vernieuwe <floris@vernieuwe.eu>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
csnake = "^0.4"
poetry = "^1.8.3"
click = "^8.1.7"
strenum = "^0.4.15"
pydantic = "^2.7.1"
