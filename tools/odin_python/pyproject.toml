[tool.poetry.group.dev.dependencies]
ruff = "^0.4.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.scripts]	
odin = "odin_python:cli"




[tool.pyright]
reportUnnecessaryIsInstance = false