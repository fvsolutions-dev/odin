# This configuration file is defines custom types that can be used in the configuration files.

includes:
  - "stdint.h"
  - "stdbool.h"
  - "odin_datastore.h"

types:
  # Custom type (Enumerator) for the direction
  direction:
    type: enumerator
    values:
      DOWN: 0
      UP: 1
      LEFT: 2
      RIGHT: 3

    default: RIGHT

  # Custom type (Enumerator) for the direction, without a default value
  direction_no_default:
    type: enumerator
    values:
      NO_DEF_DOWN: 0
      NO_DEF_UP: 1
      NO_DEF_LEFT: 2
      NO_DEF_RIGHT: 3

  # A structured type that contains a direction and a random number
  state:
    type: structured
    structure:
      # Subtype for the direction, using 2 bits
      A_state:
        primitive: direction
        length_bits: 2
        description: "Direction of the button"
        default: UP

      # Another subtype for the direction, using 2 bits
      B_state:
        primitive: direction
        length_bits: 2
        description: "Another Direction of the button"
        default: DOWN

      # A test value
      value_test:
        primitive: uint8
        length_bits: 4
        description: "Random number"
        default: 0xF

  three_axis_vector:
    type: structured
    structure:
      X:
        primitive: float32
        description: "X Value in the coordinate system"
        default: 0.0

      Y:
        primitive: float32
        description: "Y Value in the coordinate system"
        default: 0.0

      Z:
        primitive: float32
        description: "Z Value in the coordinate system"
        default: 0.0
