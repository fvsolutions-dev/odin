extensions:
  - "test/configs/common/custom_types.yaml"

variables:
  no_default_state:
    id: 0x1
    primitive: state_t
    length: 5
    description: |
      the state of the left device

  no_default_direction:
    id: 0x1
    primitive: direction_t
    length: 5
    description: |
      A direction

  partial_default_state:
    id: 0x2
    primitive: state_t
    length: 4
    description: |
      the state of the left device

    default:
      - A_state: LEFT
        value_test: 0x1
      - A_state: RIGHT
        value_test: 2
      - A_state: UP
        value_test: 3
      - A_state: DOWN
        value_test: 4


  default_state:
    id: 0x2
    primitive: state_t
    length: 4
    description: |
      the state of the left device

    default:
      - A_state: LEFT
        b_state: LEFT
        value_test: 0
      - A_state: RIGHT
        b_state: RIGHT
        value_test: 1
      - A_state: UP
        b_state: UP
        value_test: 2
      - A_state: DOWN
        b_state: DOWN
        value_test: 3



  direction:
    id: 0x3
    primitive: direction_t
    length: 5
    description: |
      A direction
    default: [DOWN, UP, LEFT, RIGHT, DOWN]

  direction_single_initialiser:
    id: 0x3
    primitive: direction_t
    length: 5
    description: |
      A direction
    default: LEFT


  no_default_directio:
    id: 0x3
    primitive: direction_no_default_t
    length: 5
    description: |
      A direction
    default: [DOWN, UP, LEFT, RIGHT, DOWN]