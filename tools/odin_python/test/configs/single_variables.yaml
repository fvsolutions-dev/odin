extensions:
  - "test/configs/common/custom_types.yaml"

variables:
  no_default_state:
    id: 0x1
    primitive: state_t
    description: |
      the state of the left device

  partial_default_state:
    id: 0x2
    primitive: state_t
    description: |
      the state of the left device

    default:
      A_state: LEFT
      value_test: 0xA

  default_state:
    id: 0x2
    primitive: state_t
    description: |
      the state of the left device

    default:
      A_state: LEFT
      b_state: LEFT
      value_test: 0

  direction:
    id: 0x3
    primitive: direction_t
    description: |
      A direction

  default_direction:
    id: 0x3
    primitive: direction_t
    description: |
      A direction

    default: LEFT
