access_groups:
  internal:
    force: RW
  disk: {}
  cli:
    force: RW
  ble:
    # force: RW
    log: W #Log successful write operations
  wifi: {}
  
extensions:
  - "test/configs/common/custom_types.yaml"

parameters:
  boot_counter:
    id: 0x1
    primitive: uint16_t
    description: |
      a top level parameter
    default: 0

  usage_data_group:
    id: 0x1A
    description: |
      Information about the usage of the device
      This data is persisted across reboots
      The data is written before right before the device powers off

    access_permissions:
      disk: RW
      ble: R

    children:
      boot_counter:
        id: 0x1
        primitive: uint16_t
        description: |
          This tracks the number of boots the system has experienced
        default: 0

      usage_data_group:
        id: 0x1A
        description: |
          Information about the usage of the device
          This data is persisted across reboots
          The data is written before right before the device powers off

        access_permissions:
          disk: RW
          ble: R

        children:
          boot_counter:
            id: 0x1
            primitive: uint16_t
            description: |
              This tracks the number of boots the system has experienced
            default: 0
