access_groups:
  internal:
    force: RW
  disk: {}
  cli:
    force: RW
  ble:
    # force: RW
    log: W #Log successful write operations
  wifi: {}
  
extensions:
  - "test/configs/common/custom_types.yaml"

datastore:
  usage_data:
    id: 0x1A
    description: |
      Information about the usage of the device
      This data is persisted across reboots
      The data is written before right before the device powers off

    access_permissions:
      disk: RW
      ble: R

    data:
      boot_counter:
        id: 0x1
        primitive: uint16_t
        description: |
          This tracks the number of boots the system has experienced
        default: 0

      energy_generated:
        id: 0x2
        primitive: uint32_t
        description: |
          Energy generated by the device
          Units: Wh
        default: 0

      travel_distance:
        id: 0x3
        primitive: uint32_t
        description: |
          Distance travelled in simulation
          Units: m
        default: 0

      motor_active_duration:
        id: 0x4
        primitive: uint32_t
        description: |
          Duration for which the motor was active
          Units: Minutes
        default: 0

      device_active_duration:
        id: 0x5
        primitive: uint32_t
        description: |
          Duration for which the device was active
          Units: Minutes
        default: 0

      motor_revolutions:
        id: 0x5
        primitive: uint32_t
        description: |
          Number of revolutions of the motor
        default: 0
